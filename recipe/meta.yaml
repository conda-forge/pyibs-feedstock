{% set name = "pyibs" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c86b1cfbf691a45d90426befcc0e78c475cb87939040d47e7ee9697ce5b7dc10

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.0.0
    - scipy >=1.13.0

test:
  imports:
    - pyibs
  commands:
    - pip check
    - python -m pytest --pyargs pyibs -x -vv
  requires:
    - pip
    - python {{ python_min }}
    - pytest >=6.2.5

about:
  home: https://acerbilab.org/pyibs/
  summary: Inverse Binomial Sampling in Python.
  description: |
    PyIBS is a Python implementation of inverse binomial sampling (IBS), which gives unbiased estimates of the log-likelihood of a model that can be simulated, for data with discrete responses, with an estimate of their variance.
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://acerbilab.org/pyibs/
  dev_url: https://github.com/acerbilab/pyibs/

extra:
  recipe-maintainers:
    - lacerbi
    - juls-art
